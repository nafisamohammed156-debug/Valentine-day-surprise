<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<title>Will You Be My Valentine?</title>  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
  
<style>  
body {  
  margin: 0;  
  height: 100vh;  
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);  
  display: flex;  
  justify-content: center;  
  align-items: center;  
  font-family: "Playfair Display", Georgia, serif;  
  color: #5a0c2d;  
  text-align: center;  
  overflow: hidden;  
  transition: background 4s ease;  
}  
  
body.dim {  
  background: radial-gradient(circle at top, #3a0f1e, #000);  
}  
  
/* Floating hearts */  
.floating-heart {  
  position: absolute;  
  animation: floatUp 10s linear infinite;  
  opacity: 0.6;  
}  
  
@keyframes floatUp {  
  0% { transform: translateY(100vh) scale(0.8); opacity: 0; }  
  20% { opacity: 0.6; }  
  100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }  
}  
  
#card {  
  background: rgba(255,255,255,0.95);  
  padding: 30px;  
  border-radius: 22px;  
  max-width: 380px;  
  box-shadow: 0 0 30px rgba(255,80,120,0.4),  
              0 20px 50px rgba(0,0,0,0.35);  
  z-index: 2;  
  position: relative;  
}  
  
button {  
  margin: 12px;  
  padding: 12px 26px;  
  font-size: 17px;  
  border-radius: 30px;  
  border: none;  
  cursor: pointer;  
  background: linear-gradient(135deg, #c2185b, #ff4d79);  
  color: white;  
}  
  
#noBtn {  
  position: absolute;  
  background: #666;  
  transition: all 0.25s ease;  
}  
  
#typedText {  
  font-size: 15.5px;  
  line-height: 1.9;  
  white-space: pre-line;  
}  
  
.cursor {  
  animation: blink 1s infinite;  
}  
  
@keyframes blink {  
  0%,50% {opacity:1;}  
  51%,100% {opacity:0;}  
}  
  
/* Memories */  
.memory-wrapper {  
  display: none;  
  margin-top: 22px;  
  display: flex;  
  flex-direction: column;  
  align-items: center;  
  gap: 18px;  
}  
  
.memory-img {  
  width: 100%;  
  max-width: 260px;  
  border-radius: 20px;  
  opacity: 0;  
  animation: fadeFloat 3s forwards;  
}  
  
.polaroid {  
  background: #fff;  
  padding: 12px 12px 28px;  
  width: 220px;  
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);  
  transform: rotate(-2deg);  
  opacity: 0;  
  animation: polaroidIn 2.5s forwards;  
  animation-delay: 1.2s;  
}  
  
.polaroid img {  
  width: 100%;  
}  
  
.polaroid span {  
  display: block;  
  margin-top: 10px;  
  font-style: italic;  
}  
  
@keyframes fadeFloat {  
  from {opacity:0; transform:translateY(15px);}  
  to {opacity:1; transform:translateY(0);}  
}  
  
@keyframes polaroidIn {  
  from {opacity:0; transform:translateY(20px) rotate(-5deg);}  
  to {opacity:1; transform:translateY(0) rotate(-2deg);}  
}  
  
/* Final moment */  
#finalMoment {  
  display: none;  
  margin-top: 22px;  
  font-size: 17px;  
  font-style: italic;  
  opacity: 0;  
  animation: finalFade 3s forwards;  
}  
  
@keyframes finalFade {  
  from {opacity:0; transform:translateY(8px);}  
  to {opacity:1; transform:translateY(0);}  
}  
</style>  
</head>  
  
<body>  
  
<!-- Floating hearts -->  
<script>  
for (let i = 0; i < 18; i++) {  
  const h = document.createElement("div");  
  h.className = "floating-heart";  
  h.innerHTML = "❤️";  
  h.style.left = Math.random() * 100 + "vw";  
  h.style.fontSize = 14 + Math.random() * 18 + "px";  
  h.style.animationDelay = Math.random() * 10 + "s";  
  document.body.appendChild(h);  
}  
</script>  
  
<div id="card">  
  <h2>Asif ❤️</h2>  
  <p>Miles apart, yet my heart always finds you.</p>  
  
  <div style="position:relative;height:80px;">  
    <button onclick="sayYes()">Yes 💖</button>  
    <button id="noBtn">No 🙈</button>  
  </div>  
</div>  
  
<audio id="loveSong"><source src="song.mp3"></audio>  
<audio id="giggle"><source src="giggle.mp3"></audio>  
  
<script>  
const noBtn = document.getElementById("noBtn");  
let escapes = 0;  
const texts = ["No 🙈", "Wait… 😅", "Okay maybe… 🫣", "😳"];  
  
function moveNo() {  
  escapes++;  
  document.getElementById("giggle").play();  
  
  if (escapes <= texts.length) noBtn.innerText = texts[escapes - 1];  
  noBtn.style.transform = `scale(${Math.max(0.6, 1 - escapes * 0.08)})`;  
  
  const card = document.getElementById("card");  
  noBtn.style.left = Math.random() * (card.offsetWidth - 80) + "px";  
  noBtn.style.top = Math.random() * (card.offsetHeight - 40) + "px";  
  
  if (escapes >= 5) noBtn.style.display = "none";  
}  
  
noBtn.onmouseenter = moveNo;  
noBtn.ontouchstart = moveNo;  
  
function sayYes() {  
  document.body.classList.add("dim");  
  document.getElementById("loveSong").play();  
  
  document.getElementById("card").innerHTML = `  
    <div id="typedText"></div><span class="cursor">▍</span>  
  
    <div class="memory-wrapper" id="memories">  
      <img src="illustration.png" class="memory-img">  
      <div class="polaroid">  
        <img src="moment.jpg">  
        <span>Our Moment 🤍</span>  
      </div>  
    </div>  
  
    <div id="finalMoment">  
      I want a lifetime of moments like this… with you.  
    </div>  
  
    <p style="margin-top:15px;font-weight:bold;">— Nafisa</p>  
  `;  
  
  const text = `  
Asif,  
  
Loving you from a distance has made my feelings for you  
louder, deeper, and impossible to hide.  
  
There are nights when I close my eyes  
and imagine you so vividly  
that my heart forgets the miles between us.  
  
You are the man my heart reaches for  
without hesitation,  
the one my soul recognizes without doubt.  
  
My heart already belongs to you —  
completely, unapologetically, endlessly.  
`;  
  
  let i = 0;  
  const speed = 55;  
  const el = document.getElementById("typedText");  
  
  function type() {  
    if (i < text.length) {  
      el.innerHTML += text.charAt(i++);  
      setTimeout(type, speed);  
    } else {  
      document.querySelector(".cursor").style.display = "none";  
      setTimeout(()=>document.getElementById("memories").style.display="flex",1600);  
      setTimeout(()=>document.getElementById("finalMoment").style.display="block",5200);  
    }  
  }  
  type();  
}  
</script>  
  
</body>  
</html>
